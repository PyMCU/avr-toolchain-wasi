[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymcu-avr-toolchain-wasi"
version = "15.2.0"
description = "AVR binutils (as/ld/objcopy) as wasm32-wasip1 modules, one wheel for every platform"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = ["wasmtime>=20"]

[tool.hatch.build.targets.wheel]
packages = ["src/pymcu_avr_toolchain_wasi"]
# The payload is git-ignored on purpose -- 105 MB of build products do not
# belong in history -- and hatchling honours VCS ignore files, so without this
# it ships a wheel with an empty wasm/ directory that installs and then finds
# no modules. Caught by the smoke test, not by the build.
artifacts = [
  "src/pymcu_avr_toolchain_wasi/wasm/**",
  "src/pymcu_avr_toolchain_wasi/sysroot/**",
  "src/pymcu_avr_toolchain_wasi/include/**",
]
